# Render Blueprint Configuration for AI Builder Academy CI Backend
services:
  - type: web
    name: ia-academy-api
    env: node
    region: frankfurt
    plan: free
    rootDir: backend-nodejs
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false # Set in Render Dashboard or via DATABASE_URL
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        sync: false # Set in Render Dashboard
